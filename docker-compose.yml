# The whole thing on one machine:
#
#   docker compose up                               the live ZET feed
#   REPLAY_DIR=/app/samples docker compose up       snapshots recorded in ./samples, on a loop
#
# The map is then at http://localhost:8000

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  producer:
    build: .
    command: ["produce"]
    environment:
      KAFKA_BROKER: kafka:29092
      REPLAY_DIR: ${REPLAY_DIR:-}
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
      REPLAY_LOOP: "1"
    volumes:
      - ./samples:/app/samples:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build: .
    command: ["process"]
    environment:
      KAFKA_BROKER: kafka:29092
      GRACE_S: ${GRACE_S:-60}
    volumes:
      - state:/app/state
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  map:
    build: .
    command: ["serve", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  state:
