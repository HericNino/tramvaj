# The map without a server: records an hour of ZET's feed, runs it through the same Kafka
# pipeline, saves what came out as site/data/replay.json and publishes site/ on GitHub Pages.
# Weekday mornings (06:07 UTC, 07:07 or 08:07 in Zagreb), or by hand from the Actions tab.
name: Replay page

on:
  schedule:
    - cron: "7 6 * * 1-5"
  workflow_dispatch:
    inputs:
      minutes:
        description: How many minutes to record
        default: "60"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAFKA_BROKER: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - run: docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.1
      - name: Record the feed
        id: record
        run: |
          if uv run tramvaj record --minutes "$MINUTES" --out samples; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          MINUTES: ${{ inputs.minutes || '60' }}
      # the feed was down the whole time: publish the site with the recording it has now
      - name: Keep the last published recording
        if: steps.record.outputs.fresh != 'true'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p site/data
          curl -fsS --retry 3 -o site/data/replay.json "https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/data/replay.json"
      - name: Run the pipeline on the recording
        if: steps.record.outputs.fresh == 'true'
        run: |
          # straight from the venv, not through uv run: a uv process left running holds uv's
          # cache lock, and setup-uv's cleanup then times out and fails the job
          .venv/bin/tramvaj process --grace 120 --state-dir state > process.log 2>&1 &
          processor=$!
          # recorded minutes ago, so the original times are well inside the topics' retention
          uv run tramvaj produce --replay samples --speed 10 --as-recorded --wait
          uv run tramvaj export --wait --out site/data/replay.json
          kill "$processor" && wait "$processor" || true
      - name: Processor log
        if: failure()
        run: tail -50 process.log
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
